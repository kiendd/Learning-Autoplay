<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>LinkedIn Learning</h1>
    <p class="status" id="status"><span class="dot"></span><span id="status-text">Đang tắt</span></p>

    <label class="row">
      <input type="checkbox" id="toggle" />
      <span>Tự động chạy lại video</span>
    </label>

    <label class="row">
      <input type="checkbox" id="auto-next" />
      <span>Tự qua trang text</span>
    </label>
    <p class="hint">Bấm Next ngay trên bài dạng text/tài liệu — bỏ qua nội dung chưa đọc.</p>

    <label class="row rate-row">
      <span>Tốc độ mặc định</span>
      <select id="rate">
        <option value="0.75">0,75×</option>
        <option value="1">1×</option>
        <option value="1.25">1,25×</option>
        <option value="1.5">1,5×</option>
        <option value="1.75">1,75×</option>
        <option value="2">2×</option>
      </select>
    </label>

    <button type="button" id="all">Bật hết</button>

    <p class="stat">Đã tự phát lại: <strong id="count">0</strong> lần</p>
    <p class="stat">Đã tự qua trang: <strong id="next-count">0</strong> lần</p>
    <p class="stat">Đã gỡ video kẹt: <strong id="unstick-count">0</strong> lần</p>
    <p class="note" id="note"></p>

    <script src="popup.js"></script>
  </body>
</html>
