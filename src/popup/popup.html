<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Tự phát lại</h1>

    <label class="row">
      <input type="checkbox" id="toggle" />
      <span id="toggle-label">Đang bật</span>
    </label>

    <label class="row">
      <input type="checkbox" id="auto-next" />
      <span>Tự qua trang text</span>
    </label>
    <p class="hint">Bấm Next ngay trên bài dạng text/tài liệu — bỏ qua nội dung chưa đọc.</p>

    <button type="button" id="all">Bật hết</button>

    <p class="stat">Đã tự phát lại: <strong id="count">0</strong> lần</p>
    <p class="stat">Đã tự qua trang: <strong id="next-count">0</strong> lần</p>
    <p class="note" id="note"></p>

    <script src="popup.js"></script>
  </body>
</html>
